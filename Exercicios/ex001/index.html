<!DOCTYPE html> <!--Indica que é um documento html 5--> 
<html lang="en"> <!--Tags que tem aberturas e fechamento, mas outras não tem; lang é um parametro que indica qual idioma vai ser o site-->
<head> <!--Parte de configurações do site-->
    <meta charset="UTF-8"> <!--É um padrão de codificação de caracteres que suporta acentuações-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Indica que o site vai estar ocupar na tela 100%-->
    <title>Meu primeiro site</title>
</head>
<body>
    <h1>Olá, mundo</h1>
    <hr>
    <p>Esse é o meu primeiro documento html! Estou muito feliz</p>
    <p>Este é um momento único! Estou criando um site!</p>
</body> <!--Parte do conteudo-->
</html>
