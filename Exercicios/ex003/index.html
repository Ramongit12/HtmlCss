<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com imagens</title>
</head>
<body>
    <h1>Testando carga e imagens</h1>
    <p>Abaixo você vai ver uma imagem que está na mesma pasta</p>
    <img src="logohtml.png" alt="Logo HTML5"> <!--O alt é uma explicação sobre o que é a imagem e serce para leitores de tela, acessibilidade para pessoas deficientes visuais-->
    <p>Podemos carregar imagens também que estão em sub-pastas</p>
    <img src="imagens/logo-css.png" alt="Logo CSS3">
    <P>Podemos carregar também imagens que estão externas</P>
    <img src="https://cdn.iconscout.com/icon/free/png-256/free-javascript-logo-icon-svg-download-png-2284965.png" alt="Logo JS">
</body>
</html>
